<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laki-Mata Scroll</title>
<style>
:root{
  --bg:#15112e; --ink:#f6f1ff; --mute:#b9b0d6; --accent:#ffd23f; --ok:#7cf0b4; --panel:rgba(21,17,46,.86);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.clip{height:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.clip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.clip .big{font-size:min(38vw,220px);line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.15))}
.clip .cap{position:absolute;left:18px;right:90px;bottom:calc(210px + env(safe-area-inset-bottom,0px));font-size:1.15rem;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.clip .cap small{display:block;font-weight:500;opacity:.85;margin-top:4px;font-size:.85rem}

.cam{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:96px;height:128px;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.35);background:#000;z-index:5;display:none}
.cam.on{display:block}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.flash{position:fixed;inset:0;pointer-events:none;background:var(--accent);opacity:0;z-index:4}
.flash.go{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.35}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash.go{animation:none}}

.hud{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);backdrop-filter:blur(10px);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0}
.status{font-size:.95rem;margin:0 0 10px;min-height:1.3em}
.meter{position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.14);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--mute);transition:width .06s linear}
.meter i.hot{background:var(--accent)}
.meter b{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ok);left:45%}
.row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.row label{font-size:.8rem;color:var(--mute);flex:1 1 100%}
input[type=range]{flex:1 1 100%;accent-color:var(--accent)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#2a2000;cursor:pointer}
button.alt,.btn.alt{background:rgba(255,255,255,.14);color:var(--ink)}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn input{display:none}
</style>
</head>
<body>

<main class="feed" id="feed" aria-label="Video feed"></main>
<div class="cam" id="cam"><video id="camVideo" playsinline muted></video></div>
<div class="flash" id="flash"></div>

<section class="hud">
  <p class="status" id="status">I-tap ang Simulan para buksan ang front camera.</p>
  <div class="meter" aria-hidden="true"><i id="bar"></i><b id="mark"></b></div>
  <div class="row">
    <label for="thr">Limit ng laki ng mata (mas mababa = mas madaling mag-scroll)</label>
    <input type="range" id="thr" min="10" max="90" value="45">
  </div>
  <div class="row">
    <button id="start">Simulan</button>
    <button id="calib" class="alt" disabled>I-calibrate</button>
    <label class="btn alt">Sariling video<input type="file" id="files" accept="video/*" multiple></label>
  </div>
</section>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = id => document.getElementById(id);
const feed = $("feed"), statusEl = $("status"), bar = $("bar"), mark = $("mark"), thr = $("thr");
const camBox = $("cam"), camVideo = $("camVideo"), flash = $("flash");

/* ---------- Feed ---------- */
const demo = [
  ["😲","Laki mata, next na!","Subukan: ibukas nang todo ang mata","#3a2bff,#9b5cff"],
  ["🐱","Pusang walang pakialam","Hindi siya nagugulat","#ff5d8f,#ff9a5c"],
  ["🍜","Mami sa ulan","Perfect sa tag-ulan","#0fa38f,#5ce1a8"],
  ["🏀","Intrams highlights","Pantheon of Hiraya","#1d4ed8,#22d3ee"],
  ["🌋","Bulkan sa gabi","Pumikit ka muna, tapos laki mata ulit","#7a1fa2,#f43f5e"],
  ["🎬","Wala nang susunod","Babalik sa simula","#374151,#9ca3af"]
];
function renderDemo(){
  feed.innerHTML = demo.map(d => `
    <article class="clip" style="background:linear-gradient(160deg,${d[3].split(",")[0]},${d[3].split(",")[1]})">
      <div class="big" aria-hidden="true">${d[0]}</div>
      <div class="cap">${d[1]}<small>${d[2]}</small></div>
    </article>`).join("");
}
renderDemo();

$("files").addEventListener("change", e => {
  const files = [...e.target.files];
  if(!files.length) return;
  feed.innerHTML = "";
  files.forEach(f => {
    const a = document.createElement("article");
    a.className = "clip";
    const v = document.createElement("video");
    v.src = URL.createObjectURL(f);
    v.loop = true; v.muted = true; v.playsInline = true;
    a.appendChild(v); feed.appendChild(a);
    io.observe(a);
  });
  feed.scrollTo({top:0});
});

const io = new IntersectionObserver(es => es.forEach(en => {
  const v = en.target.querySelector("video");
  if(!v) return;
  if(en.isIntersecting){ v.currentTime = 0; v.play().catch(()=>{}); } else v.pause();
}), {threshold:.6});

function nextClip(){
  const h = feed.clientHeight;
  const atEnd = feed.scrollTop + h >= feed.scrollHeight - 4;
  if(atEnd) feed.scrollTo({top:0, behavior:"smooth"});
  else feed.scrollBy({top:h, behavior:"smooth"});
  flash.classList.remove("go"); void flash.offsetWidth; flash.classList.add("go");
  if(navigator.vibrate) navigator.vibrate(30);
}

/* ---------- Eye detection ---------- */
let landmarker = null, running = false, lastVideoTime = -1;
let threshold = thr.value / 100;
let armed = true, heldSince = 0, lastTrigger = 0;
let calib = null; // {phase, start, samples}

const HOLD_MS = 120, COOLDOWN_MS = 1300;

function setThreshold(t){
  threshold = Math.min(.95, Math.max(.05, t));
  thr.value = Math.round(threshold * 100);
  mark.style.left = (threshold * 100) + "%";
}
setThreshold(threshold);
thr.addEventListener("input", () => setThreshold(thr.value / 100));

function say(t){ statusEl.textContent = t; }

async function start(){
  $("start").disabled = true;
  try{
    say("Binubuksan ang camera…");
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user", width:640, height:480}, audio:false});
    camVideo.srcObject = stream;
    await camVideo.play();
    camBox.classList.add("on");

    say("Nilo-load ang face tracker (isang beses lang)…");
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO",
      numFaces:1,
      outputFaceBlendshapes:true
    });
    running = true;
    $("calib").disabled = false;
    $("start").textContent = "Gumagana";
    say("Handa na. Ibukas nang todo ang mata para mag-next.");
    requestAnimationFrame(loop);
  }catch(err){
    console.error(err);
    $("start").disabled = false;
    if(!window.isSecureContext) say("Kailangan ng HTTPS o localhost para gumana ang camera.");
    else if(err && err.name === "NotAllowedError") say("Na-deny ang camera. Payagan sa browser settings, tapos subukan ulit.");
    else say("May problema sa pag-load: " + (err && err.message ? err.message : err));
  }
}
$("start").addEventListener("click", start);

function eyeScore(res){
  const bs = res.faceBlendshapes && res.faceBlendshapes[0];
  if(!bs) return null;
  let l = 0, r = 0;
  for(const c of bs.categories){
    if(c.categoryName === "eyeWideLeft") l = c.score;
    else if(c.categoryName === "eyeWideRight") r = c.score;
  }
  return (l + r) / 2;
}

$("calib").addEventListener("click", () => {
  calib = {phase:"neutral", start:performance.now(), samples:[], neutral:0};
  say("Calibration 1/2: normal na mata, huwag gumalaw…");
});

function runCalib(score, now){
  const el = now - calib.start;
  calib.samples.push(score);
  if(calib.phase === "neutral" && el > 1400){
    calib.neutral = calib.samples.reduce((a,b)=>a+b,0) / calib.samples.length;
    calib.phase = "wide"; calib.start = now; calib.samples = [];
    say("Calibration 2/2: LAKI MATA! Hawak hanggang matapos…");
  }else if(calib.phase === "wide" && el > 1800){
    const peak = Math.max(...calib.samples);
    if(peak - calib.neutral < .05){
      say("Kulang ang pagbabago. Subukan ulit at mas lakihan ang mata.");
    }else{
      setThreshold(calib.neutral + (peak - calib.neutral) * .5);
      say("Tapos na ang calibration. Laki mata para mag-next.");
    }
    calib = null; armed = false;
  }
}

function loop(){
  if(!running) return;
  if(camVideo.readyState >= 2 && camVideo.currentTime !== lastVideoTime){
    lastVideoTime = camVideo.currentTime;
    const now = performance.now();
    const res = landmarker.detectForVideo(camVideo, now);
    const s = eyeScore(res);
    if(s === null){
      bar.style.width = "0%"; bar.classList.remove("hot"); heldSince = 0;
      if(!calib) say("Walang mukha. Tumingin sa camera.");
    }else{
      bar.style.width = Math.min(100, s * 100) + "%";
      bar.classList.toggle("hot", s > threshold);
      if(calib){
        runCalib(s, now);
      }else{
        if(s > threshold){
          if(!heldSince) heldSince = now;
          if(armed && now - heldSince >= HOLD_MS && now - lastTrigger > COOLDOWN_MS){
            armed = false; lastTrigger = now; nextClip();
          }
        }else{
          heldSince = 0;
          if(s < threshold * .8) armed = true;
        }
      }
    }
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
